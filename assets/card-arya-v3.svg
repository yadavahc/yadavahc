<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Arya: Multilingual voice AI clinical companion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090C18"/><stop offset="1" stop-color="#121332"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.32"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="1000" height="290" rx="20"/></clipPath>
  </defs>
  <style>
    .shine{animation:sweep 5s ease-in-out infinite}
    @keyframes sweep{from{transform:translateX(-260px)}to{transform:translateX(1060px)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1.08);opacity:1}}
    .bar{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite}
    @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1000" height="290" fill="url(#bg)"/>
    <circle class="pulse" cx="900" cy="140" r="140" fill="url(#glow)"/>
    <rect class="shine" x="0" y="0" width="240" height="3" fill="url(#shine)"/>
    <rect x="40" y="32" width="638" height="28" rx="14" fill="#FBBF24" fill-opacity="0.12" stroke="#FBBF24" stroke-opacity="0.6"/>
    <text x="359" y="51" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1" fill="#FBBF24">WINNER · INDIA'S FIRST AI AGENT BUILDERS AWARD 2026 · MOST IMPACTFUL USE CASE</text>
    <text x="40" y="118" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC">Arya</text>
    <text x="40" y="152" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#A78BFA">Multilingual voice AI clinical companion</text>
    <text x="40" y="186" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#94A3B8">Patients phone in and Arya answers in their language, with their medical history in</text>
    <text x="40" y="210" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#94A3B8">context: RAG over their reports, appointment booking by voice, Google Fit vitals.</text>
    <rect x="40" y="236" width="77" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="78.5" y="255" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#CBD5E1">Next.js</text>
<rect x="126" y="236" width="77" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="164.5" y="255" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#CBD5E1">FastAPI</text>
<rect x="212" y="236" width="92" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="258" y="255" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#CBD5E1">LangGraph</text>
<rect x="313" y="236" width="70" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="348" y="255" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#CBD5E1">OpenAI</text>
<rect x="392" y="236" width="92" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="438" y="255" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#CBD5E1">Sarvam AI</text>
<rect x="493" y="236" width="77" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="531.5" y="255" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#CBD5E1">LiveKit</text>
<rect x="579" y="236" width="70" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="614" y="255" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#CBD5E1">Twilio</text>
<rect x="658" y="236" width="85" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="700.5" y="255" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" fill="#CBD5E1">Firebase</text>
    <rect class="bar" style="animation-delay:0.00s" x="841" y="122" width="10" height="36" rx="5" fill="#A78BFA"/>
<rect class="bar" style="animation-delay:0.13s" x="859" y="106.25" width="10" height="67.5" rx="5" fill="#A78BFA"/>
<rect class="bar" style="animation-delay:0.26s" x="877" y="95" width="10" height="90" rx="5" fill="#A78BFA"/>
<rect class="bar" style="animation-delay:0.39s" x="895" y="113" width="10" height="54" rx="5" fill="#A78BFA"/>
<rect class="bar" style="animation-delay:0.52s" x="913" y="99.5" width="10" height="81" rx="5" fill="#A78BFA"/>
<rect class="bar" style="animation-delay:0.65s" x="931" y="117.5" width="10" height="45" rx="5" fill="#A78BFA"/>
<rect class="bar" style="animation-delay:0.78s" x="949" y="126.5" width="10" height="27" rx="5" fill="#A78BFA"/>
  </g>
  <rect x="0.75" y="0.75" width="998.5" height="288.5" rx="19.5" fill="none" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1.5"/>
</svg>
