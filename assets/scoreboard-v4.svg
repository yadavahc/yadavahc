  </style>
  <g class="tile" style="animation-delay:0.15s">
      <rect x="30" y="20" width="270" height="180" rx="18" fill="#0C0F24" stroke="#FBBF24" stroke-opacity="0.35"/>
      <rect x="54" y="20" width="222" height="3" rx="1.5" fill="#FBBF24">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="165" y="100" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#FBBF24">01</text>
      <text x="165" y="140" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F1F5F9">National AI Award</text>
      <text x="165" y="168" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#94A3B8">AI Agent Builders Award '26</text>
    </g>
<g class="tile" style="animation-delay:0.35s">
      <rect x="320" y="20" width="270" height="180" rx="18" fill="#0C0F24" stroke="#A78BFA" stroke-opacity="0.35"/>
      <rect x="344" y="20" width="222" height="3" rx="1.5" fill="#A78BFA">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <text x="455" y="100" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#A78BFA">3×</text>
      <text x="455" y="140" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F1F5F9">Hackathon Winner</text>
      <text x="455" y="168" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#94A3B8">prize-winning hackathon builds</text>
    </g>
<g class="tile" style="animation-delay:0.55s">
      <rect x="610" y="20" width="270" height="180" rx="18" fill="#0C0F24" stroke="#22D3EE" stroke-opacity="0.35"/>
      <rect x="634" y="20" width="222" height="3" rx="1.5" fill="#22D3EE">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="745" y="100" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#22D3EE">10×</text>
      <text x="745" y="140" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F1F5F9">Hackathon Finalist</text>
      <text x="745" y="168" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#94A3B8">incl. HackBLR · Cypher Quest</text>
    </g>
<g class="tile" style="animation-delay:0.7500000000000001s">
      <rect x="900" y="20" width="270" height="180" rx="18" fill="#0C0F24" stroke="#F472B6" stroke-opacity="0.35"/>
      <rect x="924" y="20" width="222" height="3" rx="1.5" fill="#F472B6">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="1035" y="100" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#F472B6">Top 30</text>
      <text x="1035" y="140" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#F1F5F9">GFG TOCE Campus</text>
      <text x="1035" y="168" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#94A3B8">of 1000+ · 200+ DSA solved</text>
