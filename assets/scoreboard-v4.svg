<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="1 national AI award, 3x hackathon winner, 10x hackathon finalist, top 30 in GFG TOCE campus with 200+ DSA problems solved">
  <style>
    .tile{opacity:0;animation:pop .7s cubic-bezier(.2,.8,.2,1.2) forwards}
