<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></linearGradient>
    <radialGradient id="dot"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  </defs>
  <style>.dot{animation:run 4s ease-in-out infinite alternate}@keyframes run{from{transform:translateX(150px)}to{transform:translateX(1050px)}}</style>
  <rect x="0" y="5" width="1200" height="2" fill="url(#g)"/>
  <circle class="dot" cx="0" cy="6" r="6" fill="url(#dot)"/>
</svg>
