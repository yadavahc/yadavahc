<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Yadava HC: full stack developer, AI builder, 3x hackathon winner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/><stop offset="1" stop-color="#12123A"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.40"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/></pattern>
    <clipPath id="clip"><rect width="1200" height="380" rx="26"/></clipPath>
  </defs>
  <style>
    .orbA{animation:driftA 16s ease-in-out infinite alternate}
    .orbB{animation:driftB 19s ease-in-out infinite alternate}
    @keyframes driftA{from{transform:translate(0,0)}to{transform:translate(260px,60px)}}
    @keyframes driftB{from{transform:translate(0,0)}to{transform:translate(-300px,-50px)}}
    .bar{transform-box:fill-box;transform-origin:center;animation:eq 1.1s ease-in-out infinite}
    @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
    .fade{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle class="orbA" cx="230" cy="80" r="260" fill="url(#orbA)"/>
    <circle class="orbB" cx="1000" cy="320" r="280" fill="url(#orbB)"/>
    <rect class="scan" x="0" y="0" width="220" height="2" fill="url(#txt)" opacity="0.8"/>

    <g class="fade" style="animation-delay:.1s">
      <text x="70" y="92" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="17" fill="#22D3EE">&gt; whoami<tspan fill="#64748B">   // Bengaluru, India</tspan></text>
    </g>
    <g class="fade" style="animation-delay:.35s">
      <text x="66" y="180" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="3" fill="url(#txt)">YADAVA HC</text>
    </g>
    <g class="fade" style="animation-delay:.7s">
      <text x="70" y="228" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#E2E8F0">Full Stack Developer <tspan fill="#64748B">·</tspan> AI Builder <tspan fill="#64748B">·</tspan> 3× Hackathon Winner</text>
    </g>
    <g class="fade" style="animation-delay:1.1s">
      <rect x="70" y="262" width="266" height="34" rx="17" fill="#FBBF24" fill-opacity="0.10" stroke="#FBBF24" stroke-opacity="0.55"/>
      <text x="203" y="284" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1" fill="#FBBF24">NATIONAL AI AGENT AWARD '26</text>
    </g>
<g class="fade" style="animation-delay:1.35s">
      <rect x="348" y="262" width="206" height="34" rx="17" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.55"/>
      <text x="451" y="284" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1" fill="#A78BFA">6× HACKATHON PODIUMS</text>
    </g>
<g class="fade" style="animation-delay:1.6s">
      <rect x="566" y="262" width="129" height="34" rx="17" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.55"/>
      <text x="630.5" y="284" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1" fill="#22D3EE">3× FINALIST</text>
    </g>
<g class="fade" style="animation-delay:1.85s">
      <rect x="707" y="262" width="86" height="34" rx="17" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-opacity="0.55"/>
      <text x="750" y="284" text-anchor="middle" font-family="'Segoe UI', 'Inter', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="1" fill="#F472B6">CGPA 9</text>
    </g>
    <g class="fade" style="animation-delay:2.3s">
      <text x="70" y="342" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="16" fill="#94A3B8">$ shipping full-stack apps with AI inside<tspan class="cur" fill="#22D3EE">▌</tspan></text>
    </g>

    
    <circle cx="1035" cy="185" r="70" fill="none" stroke="#8B5CF6" stroke-width="2">
      <animate attributeName="r" values="70;150" dur="3.6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1035" cy="185" r="70" fill="none" stroke="#8B5CF6" stroke-width="2">
      <animate attributeName="r" values="70;150" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1035" cy="185" r="70" fill="none" stroke="#8B5CF6" stroke-width="2">
      <animate attributeName="r" values="70;150" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1035" cy="185" r="70" fill="#0C0F24" stroke="url(#txt)" stroke-width="2.5"/>
    <rect class="bar" style="animation-delay:0.00s" x="979.5" y="172.75" width="7" height="24.5" rx="3.5" fill="url(#txt)"/>
<rect class="bar" style="animation-delay:0.11s" x="992.5" y="164" width="7" height="42" rx="3.5" fill="url(#txt)"/>
<rect class="bar" style="animation-delay:0.22s" x="1005.5" y="153.5" width="7" height="63" rx="3.5" fill="url(#txt)"/>
<rect class="bar" style="animation-delay:0.33s" x="1018.5" y="165.75" width="7" height="38.5" rx="3.5" fill="url(#txt)"/>
<rect class="bar" style="animation-delay:0.44s" x="1031.5" y="150" width="7" height="70" rx="3.5" fill="url(#txt)"/>
<rect class="bar" style="animation-delay:0.55s" x="1044.5" y="160.5" width="7" height="49" rx="3.5" fill="url(#txt)"/>
<rect class="bar" style="animation-delay:0.66s" x="1057.5" y="151.75" width="7" height="66.5" rx="3.5" fill="url(#txt)"/>
<rect class="bar" style="animation-delay:0.77s" x="1070.5" y="167.5" width="7" height="35" rx="3.5" fill="url(#txt)"/>
<rect class="bar" style="animation-delay:0.88s" x="1083.5" y="174.5" width="7" height="21" rx="3.5" fill="url(#txt)"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>
</svg>
